name: Build and Release FastAccses

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: 'release/*.exe'
          - os: ubuntu-latest
            artifact: |
              release/*.AppImage
              release/*.deb
          - os: macos-latest
            artifact: 'release/*.dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build native C++ launcher
        shell: bash
        run: |
          mkdir -p native/bin
          if [[ "${{ runner.os }}" == "Windows" ]]; then g++ -std=c++17 native/launcher.cpp -o native/bin/fastaccses-launcher.exe; else g++ -std=c++17 native/launcher.cpp -o native/bin/fastaccses-launcher; fi
      - name: Package application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastAccses-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
